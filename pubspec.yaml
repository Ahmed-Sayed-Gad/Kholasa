name: project_one_c3_team
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_screenutil:
  get_it:
  google_fonts: ^6.2.1
  injectable:
  json_annotation: ^4.9.0
  logger:
  modal_progress_hud_nsn: ^0.5.1
  pretty_dio_logger:
